name: CI
on: [push, pull_request]
jobs:
  build-linux:
    # Python 3.6 + OpenSSL 1.1 (Debian bullseye): the pinned PyQt5 5.9.2 /
    # PyInstaller 3.4 / fbs 0.9.0 set needs Python <= 3.7.
    runs-on: ubuntu-24.04
    container: python:3.6-bullseye
    steps:
    - uses: actions/checkout@v4
    - name: Install system libraries
      run: |
        # bullseye has moved to the Debian archive
        rm -f /etc/apt/sources.list.d/*
        printf 'deb http://archive.debian.org/debian bullseye main\ndeb http://archive.debian.org/debian-security bullseye-security main\n' > /etc/apt/sources.list
        apt-get -o Acquire::Check-Valid-Until=false update
        apt-get install -y libusb-1.0-0-dev libudev-dev libgl1 libglib2.0-0 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 libasound2-dev
    - name: Setup venv
      run: |
        python -m venv venv
        . venv/bin/activate
        python -m pip install --upgrade pip setuptools==45.2.0 wheel
        pip install "Cython>=0.29.0,<3.0.0"
        pip install hidapi==0.14.0
        pip install "python-rtmidi>=1.4.9"
        pip install altgraph==0.17 fbs==0.9.0 future==0.18.2 keyboard==0.13.5 macholib==1.14 pefile==2019.4.18 PyInstaller==3.4 PyQt5==5.9.2 sip==4.19.8 certifi
        pip install https://github.com/danthedeckie/simpleeval/archive/41c99b8e224a7a0ae0ac59c773598fe79a4470db.zip
    - name: Build
      run: |
        . venv/bin/activate
        fbs freeze
        tar -C target -czf midiswitch-linux.tar.gz "MIDIswitch KeyStation"
    - uses: actions/upload-artifact@v4
      with:
        name: midiswitch-linux
        path: midiswitch-linux.tar.gz
  build-mac:
    # Intel runner: PyQt5 5.9.2 has Intel-only Mac wheels (runs on Apple
    # Silicon through Rosetta). Python 3.7 is the newest PyInstaller 3.4 takes.
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.7.17'
    - name: Setup venv
      run: |
        python3 -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip setuptools==45.2.0 wheel
        pip install "Cython>=0.29.0,<3.0.0"
        pip install hidapi==0.14.0
        pip install python-rtmidi==1.4.9  # newest with a Python 3.7 Mac wheel
        pip install altgraph==0.17 fbs==0.9.0 future==0.18.2 keyboard==0.13.5 macholib==1.14 pefile==2019.4.18 PyInstaller==3.4 PyQt5==5.9.2 sip==4.19.8 certifi
        pip install https://github.com/danthedeckie/simpleeval/archive/41c99b8e224a7a0ae0ac59c773598fe79a4470db.zip
    - name: Build
      run: |
        source venv/bin/activate
        fbs freeze
        hdiutil create -volname "MIDIswitch KeyStation" -srcfolder "target/MIDIswitch KeyStation.app" -ov -format UDZO midiswitch-mac.dmg
    - uses: actions/upload-artifact@v4
      with:
        name: midiswitch-mac
        path: midiswitch-mac.dmg
  build-win:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4  # Updated to v4 for Node.js 20 support
    
    - name: Install Visual C++ Redistributables - Force Chocolatey
      run: |
        # Update chocolatey first
        choco upgrade chocolatey -y
        
        # Force install with various flags
        choco install vcredist2010 -y --force --ignore-checksums --allow-empty-checksums --no-progress
        choco install vcredist2012 -y --force --ignore-checksums --allow-empty-checksums --no-progress
        
        # Verify installation
        Get-ChildItem "C:\Windows\System32" -Filter "*msvcr*" | Select-Object Name, LastWriteTime
        Get-ChildItem "C:\Windows\SysWOW64" -Filter "*msvcr*" | Select-Object Name, LastWriteTime
      shell: powershell
        
    - uses: actions/setup-python@v5  # Updated to v5 for Node.js 20 support
      with:
        python-version: '3.6.x'
    - name: Setup venv
      run: |
        python -m venv venv
        . .\venv\Scripts\activate.ps1
        python -m pip install --upgrade pip setuptools==45.2.0 wheel
        pip install "Cython>=0.29.0,<3.0.0"
        pip install hidapi==0.14.0
        pip install "python-rtmidi>=1.4.9"
        pip install altgraph==0.17 fbs==0.9.0 future==0.18.2 keyboard==0.13.5 macholib==1.14 pefile==2019.4.18 PyInstaller==3.4 PyQt5==5.9.2 sip==4.19.8 certifi
        pip install "pywin32==303; sys_platform == 'win32'"
        pip install https://github.com/danthedeckie/simpleeval/archive/41c99b8e224a7a0ae0ac59c773598fe79a4470db.zip
    - name: Install NSIS
      run: |
        Invoke-WebRequest "https://github.com/vial-kb/vial-deps/releases/download/v1/nsis-3.06.1-setup.exe" -UserAgent "wget" -OutFile nsis-3.06.1-setup.exe
        if ((Get-FileHash nsis-3.06.1-setup.exe -Algorithm sha256).Hash -ne "f60488a676308079bfdf6845dc7114cfd4bbff47b66be4db827b89bb8d7fdc52") { Write-Error 'SHA256 mismatch' }
        Start-Process -FilePath "nsis-3.06.1-setup.exe" -ArgumentList "/S", "/D=C:\Program Files (x86)\NSIS" -NoNewWindow -Wait
    - name: Build
      run: |
        . .\venv\Scripts\activate.ps1
        fbs freeze
        Compress-Archive -Path "target\MIDIswitch KeyStation" -DestinationPath midiswitch-win.zip
    - uses: actions/upload-artifact@v4  # Updated to v4 for Node.js 20 support
      with:
        name: midiswitch-win
        path: midiswitch-win.zip
    - name: Create installer
      run: |
        $env:Path += ";C:\Program Files (x86)\NSIS"
        . .\venv\Scripts\activate.ps1
        fbs installer
    - uses: actions/upload-artifact@v4  # Updated to v4 for Node.js 20 support
      with:
        name: midiswitch-win-installer
        path: target\MIDIswitch KeyStationSetup.exe